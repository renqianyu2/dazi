<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>苹湖拼音打字系统 - 英语闯关冒险</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        :root {
            --adv-bg: #2b1055;
            --accent-color: #f093fb;
            --danger-color: #f5576c;
            --success-color: #38ef7d;
            --glass-bg: rgba(255, 255, 255, 0.1);
        }

        body {
            background: linear-gradient(135deg, #2b1055 0%, #7597de 100%);
            color: white;
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            justify-content: flex-start;
            overflow: hidden;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(15px);
            border-bottom: 2px solid rgba(240, 147, 251, 0.3);
            z-index: 50;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .stat-group {
            display: flex;
            gap: 40px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-label {
            font-size: 11px;
            letter-spacing: 2px;
            color: var(--accent-color);
            opacity: 0.8;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 800;
            font-family: monospace;
            color: white;
        }

        /* Sidebar Leaderboard */
        .sidebar-right {
            position: absolute;
            top: 100px;
            right: 20px;
            width: 250px;
            height: calc(100vh - 180px);
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(240, 147, 251, 0.3);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            display: none;
            flex-direction: column;
            z-index: 40;
            overflow: hidden;
        }
        
        .sidebar-title {
            padding: 15px;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            border-bottom: 1px solid rgba(240, 147, 251, 0.3);
            background: rgba(240, 147, 251, 0.2);
        }

        .leaderboard-list {
            flex: 1;
            position: relative;
            overflow-y: auto;
            padding: 10px;
            list-style: none;
            margin: 0;
        }

        .lb-item {
            position: absolute;
            width: calc(100% - 20px);
            height: 40px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
            box-sizing: border-box;
            transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .lb-item .lb-rank { font-weight: bold; width: 30px; }
        .lb-item .lb-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px;}
        .lb-item .lb-score { color: var(--accent-color); font-family: monospace; font-weight: bold; }

        .lb-item.rank-1 { background: linear-gradient(90deg, rgba(255,215,0,0.3) 0%, rgba(255,215,0,0) 100%); border-color: gold; color: gold; z-index: 3; }
        .lb-item.rank-2 { background: linear-gradient(90deg, rgba(192,192,192,0.3) 0%, rgba(192,192,192,0) 100%); border-color: silver; color: silver; z-index: 2; }
        .lb-item.rank-3 { background: linear-gradient(90deg, rgba(205,127,50,0.3) 0%, rgba(205,127,50,0) 100%); border-color: #cd7f32; color: #cd7f32; z-index: 1; }
        .lb-item.is-me { border: 2px solid var(--accent-color); box-shadow: inset 0 0 10px rgba(240, 147, 251, 0.3); }

        .player-info {
            position: absolute;
            top: 100px;
            left: 20px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(240, 147, 251, 0.3);
            padding: 10px 20px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            z-index: 50;
            display: none;
        }

        .player-name {
            font-size: 18px;
            color: var(--accent-color);
            font-weight: bold;
        }

        /* 关卡选择区域 */
        .level-select-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
        }

        .level-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            max-width: 900px;
            width: 100%;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
            max-width: 1000px;
            width: 100%;
        }

        @media (max-width: 800px) {
            .category-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .level-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .level-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            padding: 25px 15px;
            border-radius: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            backdrop-filter: blur(5px);
        }

        .level-btn:hover:not(.locked) {
            transform: translateY(-5px);
            border-color: var(--accent-color);
            box-shadow: 0 10px 20px rgba(240, 147, 251, 0.3);
            background: rgba(255, 255, 255, 0.2);
        }

        .level-btn.locked {
            opacity: 0.4;
            cursor: not-allowed;
            filter: grayscale(1);
        }

        .level-btn.completed {
            border-color: var(--success-color);
            background: rgba(56, 239, 125, 0.15);
        }

        .level-number {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 5px;
            color: white;
        }

        .level-theme {
            font-size: 16px;
            color: #ddd;
        }

        /* 游戏区域 */
        #gameArea {
            display: none;
            flex: 1;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .play-card {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(240, 147, 251, 0.4);
            border-radius: 20px;
            padding: 50px 80px;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            max-width: 600px;
            width: 100%;
            position: relative;
        }

        .word-icon {
            font-size: 80px;
            margin-bottom: 20px;
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.4));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        .english-word {
            font-size: 60px;
            font-family: monospace;
            font-weight: bold;
            letter-spacing: 5px;
            margin-bottom: 10px;
            color: rgba(255, 255, 255, 0.4);
        }

        .english-word .typed {
            color: var(--success-color);
            text-shadow: 0 0 15px var(--success-color);
        }

        .english-word .error {
            color: var(--danger-color);
            text-shadow: 0 0 15px var(--danger-color);
        }

        .chinese-meaning {
            font-size: 24px;
            color: #ddd;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        /* 进度条 */
        .progress-container {
            width: 100%;
            height: 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            margin-top: 40px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-color), var(--success-color));
            transition: width 0.3s ease-out;
            box-shadow: 0 0 10px var(--success-color);
        }

        .screen-flash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(245, 87, 108, 0.3);
            pointer-events: none;
            z-index: 999;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .screen-flash.active {
            opacity: 1;
        }

        @keyframes flashFade {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }

        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.8);
            z-index: 100;
        }

        .menu-card {
            background: rgba(43, 16, 85, 0.9);
            padding: 60px;
            border-radius: 20px;
            text-align: center;
            border: 2px solid var(--accent-color);
            box-shadow: 0 0 40px rgba(240, 147, 251, 0.2);
        }
    </style>
</head>

    <div class="screen-flash" id="screenFlash"></div>

    <div class="game-header">
        <div class="header-left">
            <a id="backBtn" href="practice.html" style="color: var(--accent-color); text-decoration: none; font-weight: bold; border: 1px solid var(--accent-color); padding: 5px 15px; border-radius: 20px; cursor: pointer;">[ 返回 ]</a>
            <button id="muteBtn" class="mute-btn" onclick="Sound.toggleMute(); updateMuteBtn(); if(synth) synth.cancel();">音效: 开启</button>
        </div>
        <div class="stat-group">
            <div class="stat-item">
                <div class="stat-label">SCORE</div>
                <div class="stat-value" id="scoreValue">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">LEVEL</div>
                <div class="stat-value" id="levelValue">-</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">WORD</div>
                <div class="stat-value" id="wordProgress">0/10</div>
            </div>
        </div>
    </div>

    <!-- 玩家信息栏 -->
    <div class="player-info" id="playerInfoUI">
        <div class="player-name" id="uiPlayerName">访客</div>
    </div>

    <!-- 排行榜系统 (Leaderboard) -->
    <div class="sidebar-right" id="leaderboardSidebar">
        <div class="sidebar-title">实时荣誉榜</div>
        <ul class="leaderboard-list" id="lbList">
            <!-- Items injected by JS -->
        </ul>
    </div>

    <!-- 选关界面 -->
    <div class="level-select-container" id="levelSelectArea">
        <h1 style="color: white; font-size: 48px; margin-bottom: 20px; text-shadow: 0 0 20px var(--accent-color);">🗺️ 英语闯关冒险</h1>
        <p style="color: #ddd; font-size: 18px; margin-bottom: 40px;">纯正英文打字发音，告别繁琐视线转移</p>
        
        <!-- 词库选择区域 -->
        <div id="categorySelectArea" style="margin-bottom: 30px;">
            <h3 style="color: var(--accent-color); margin-bottom: 15px;">🎯 选择词库类型</h3>
            <div class="category-grid" id="categoryGrid"></div>
        </div>
        
        <!-- 关卡选择区域 -->
        <div id="levelSelectInner" style="display: none;">
            <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 20px;">
                <button onclick="backToCategories()" style="background: var(--accent-color); color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: bold;">← 返回词库</button>
                <h3 style="color: white; margin: 0;" id="currentCategoryTitle"></h3>
            </div>
            <div class="level-grid" id="levelGrid"></div>
        </div>
    </div>

    <!-- 游戏界面 -->
    <div id="gameArea">
        <div class="play-card" id="playCard">
            <div class="word-icon" id="currentIcon">🌸</div>
            <div class="chinese-meaning" id="currentMeaning">春天</div>
            <div class="english-word" id="currentWordDisplay">
                <!-- Example: <span class="typed">s</span>pring -->
                SPRING
            </div>
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
        </div>
    </div>

    <!-- 结算蒙版 -->
    <div id="gameOverOverlay" class="ui-overlay" style="display: none;">
        <div class="menu-card">
            <h1 style="color: white; font-size: 48px; margin-bottom: 20px;" id="endTitle">🎉 关卡完成</h1>
            <div style="font-size: 80px; margin: 30px 0; color: var(--success-color); font-weight: bold; font-family: monospace;" id="finalScore">0</div>
            
            <button onclick="backToLevels()" style="background: var(--accent-color); color: white; border: none; padding: 15px 40px; font-size: 20px; border-radius: 30px; cursor: pointer; font-weight: bold; margin-top: 20px;">返回选关</button>
        </div>
    </div>

    <script src="js/sound.js"></script>
    <script src="js/api.js"></script>

            sidebarVisible: false,
            init(inGame = false) {
                try {
                    const studentInfo = JSON.parse(localStorage.getItem('studentInfo') || '{}');
                    if (studentInfo.id && studentInfo.name) {
                        this.myId = studentInfo.id;
                        this.myName = studentInfo.name;
                    } else {
                        this.myId = 'guest_' + Math.floor(Math.random()*10000);
                    }
                    
                    this.sidebarVisible = inGame;
                    document.getElementById('uiPlayerName').innerText = this.myName;
                    document.getElementById('playerInfoUI').style.display = inGame ? 'block' : 'none';
                    document.getElementById('leaderboardSidebar').style.display = inGame ? 'flex' : 'none';

                    if (!this._socketInited && typeof io !== 'undefined') {
                        this._socketInited = true;
                        this.socket = io();
                        this.socket.on('connect', () => {
                            this.socket.emit('join_typist', { user_id: this.myId, username: this.myName });
                        });
                        this.socket.on('leaderboard_update', (list) => {
                            if (list && list.length > 0) {
                                this.lastLeaderboard = list;
                                if (this.sidebarVisible) this.renderLeaderboard(list);
                            }
                        });
                    }

                    if (inGame) {
                        this.renderLeaderboard(this.lastLeaderboard || [{ username: this.myName, score: 0 }]);
                    }
                } catch(e) {
                    console.warn("Socket.io initialization skipped or failed", e);
                    this._socketInited = false;
                }
            },
            updateScore(score) {
                if (this.socket && this.socket.connected) {
                    this.socket.emit('update_score', { score, wpm: 0 }); 
                } else {
                    this.renderLeaderboard([{ username: this.myName, score }]);
                }
            },
            resetScore() {
                if (this.socket && this.socket.connected) {
                    this.socket.emit('reset_score');
                }
            },
            renderLeaderboard(list) {
                const ul = document.getElementById('lbList');
                const ITEM_HEIGHT = 45; 
                
                const existingItems = new Map();
                Array.from(ul.children).forEach(li => {
                    existingItems.set(li.dataset.name, li);
                });

                list.forEach((p, idx) => {
                    const currentRank = idx + 1;
                    const isMe = p.username === this.myName;
                    
                    let li = existingItems.get(p.username);
                    if (!li) {
                        li = document.createElement('li');
                        li.className = 'lb-item';
                        li.dataset.name = p.username;
                        li.innerHTML = `
                            <span class="lb-rank"></span>
                            <span class="lb-name"></span>
                            <span class="lb-score"></span>
                        `;
                        ul.appendChild(li);
                    } else {
                        existingItems.delete(p.username);
                    }
                    
                    li.querySelector('.lb-rank').innerText = currentRank;
                    li.querySelector('.lb-score').innerText = p.score;
                    li.querySelector('.lb-name').innerText = p.username;
                    
                    li.style.transform = `translateY(${idx * ITEM_HEIGHT}px)`;
                    li.classList.remove('rank-1', 'rank-2', 'rank-3', 'is-me');
                    if (currentRank === 1) li.classList.add('rank-1');
                    if (currentRank === 2) li.classList.add('rank-2');
                    if (currentRank === 3) li.classList.add('rank-3');
                    if (isMe) li.classList.add('is-me');
                });

            }

        let gameState = 'MENU';
        let typedCount = 0;
        
        // 多维度数据统计
        let totalKeystrokes = 0;      // 总按键次数
        let correctKeystrokes = 0;    // 正确按键次数
        let errorKeystrokes = 0;      // 错误按键次数
        let wordsCompleted = 0;       // 完成的单词数
        let levelStartTime = 0;      // 关卡开始时间
        let combo = 0;               // 当前连击
        let maxCombo = 0;            // 最大连击
        
        const flashEl = document.getElementById('screenFlash');
        const synth = window.speechSynthesis;
        let selectedVoice = null;

        // 初始化静音按钮状态和语音
        function updateMuteBtn() {
            const btn = document.getElementById('muteBtn');
            if (btn) {
                btn.innerHTML = `音效: ${Sound.muted ? '关闭' : '开启'}`;
                btn.className = `mute-btn ${Sound.muted ? 'muted' : ''}`;
            }
        }
        updateMuteBtn();

        // 初始化语音，选择英式女声
        function initVoice() {
            if (!synth) return;
            const voices = synth.getVoices();
            // 优先选择英式英语女声
            selectedVoice = voices.find(v => v.lang === 'en-GB' && v.name.includes('Female')) 
                || voices.find(v => v.lang === 'en-GB')
                || voices.find(v => v.lang.startsWith('en') && v.name.includes('Female'))
                || voices.find(v => v.lang.startsWith('en'));
        }
        
        // 浏览器需要等待语音列表加载
        if (synth) {
            if (synth.getVoices().length > 0) {
                initVoice();
            } else {
                synth.onvoiceschanged = initVoice;
            }
        }

        // 钢琴音效 - 输入正确时的声音
        function playPianoSound() {
            if (Sound.muted) return;
            const ctx = Sound._getContext();
            const t = ctx.currentTime;
            
            // 随机选择一个钢琴音区的音符 (C4-C6)
            const notes = [261.63, 293.66, 311.13, 349.23, 392.00, 440.00, 493.88, 523.25, 587.33, 659.25];
            const freq = notes[Math.floor(Math.random() * notes.length)];
            
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            
            osc.type = 'triangle'; // 三角波更像钢琴音色
            osc.frequency.value = freq;
            
            // 钢琴音色包络：快速起音，缓慢衰减
            gain.gain.setValueAtTime(0, t);
            gain.gain.linearRampToValueAtTime(0.2, t + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
            
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(t);
            osc.stop(t + 0.4);
        }

        function playSfx(type) {
            if (Sound.muted) return;
            if (type === 'hit') playPianoSound();
            else if (type === 'miss') Sound.playError();
            else if (type === 'complete') Sound.playComplete();
        }

        function speakWord(text) {
            if (synth && !Sound.muted) {
                const utterance = new SpeechSynthesisUtterance(text);
                // 使用英式英语
                utterance.lang = 'en-GB';
                // 使用选定的语音
                if (selectedVoice) {
                    utterance.voice = selectedVoice;
                }
                utterance.rate = 0.85; // 稍微放慢，更清晰
                utterance.pitch = 1.0;
                synth.speak(utterance);
            }
        }

        function initCategories() {
            const grid = document.getElementById('categoryGrid');
            grid.innerHTML = categories.map((cat, i) => {
                return `<div class="level-btn" onclick="selectCategory('${cat.id}')" style="padding: 20px 30px;">
                    <div style="font-size: 48px; margin-bottom: 10px;">${cat.icon}</div>
                    <div class="level-theme">${cat.name}</div>
                    <div style="font-size: 12px; color: #aaa; margin-top: 5px;">${cat.levels.length} 个主题</div>
                </div>`;
            }).join('');
            
            // 显示词库选择区域
            document.getElementById('categorySelectArea').style.display = 'block';
            document.getElementById('levelSelectInner').style.display = 'none';
            
            // Initialization point for socket - 选关界面不显示排行榜
            netEngine.init(false);
        }

        function selectCategory(categoryId) {
            currentCategory = categories.find(c => c.id === categoryId);
            if (!currentCategory) return;
            
            levels = currentCategory.levels;
            
            // 显示关卡选择区域
            document.getElementById('categorySelectArea').style.display = 'none';
            document.getElementById('levelSelectInner').style.display = 'block';
            document.getElementById('currentCategoryTitle').innerHTML = `${currentCategory.icon} ${currentCategory.name}`;
            
            renderLevelGrid();
        }

        function backToCategories() {
            currentCategory = null;
            initCategories();
        }

        function renderLevelGrid() {
            const grid = document.getElementById('levelGrid');
            grid.innerHTML = levels.map((level, i) => {
                const completed = completedLevels.includes(`${currentCategory.id}_${i}`);
                return `<div class="level-btn ${completed ? 'completed' : ''}"
                        onclick="startLevel(${i})">
                    <div class="level-number">Level ${i + 1}</div>
                    <div class="level-theme">${level.theme} - ${level.zhTheme}</div>
                    ${completed ? '<div style="margin-top:10px;font-size:20px;">✅</div>' : ''}
                </div>`;
            }).join('');
        }

        function initLevels() {
            initCategories();
        }

        function startLevel(levelIdx) {
            currentLevel = levelIdx;
            currentWordIndex = 0;
            score = 0;
            typedCount = 0;
            gameState = 'PLAYING';
            levelStartTime = Date.now();
            
            // 重置多维度统计
            totalKeystrokes = 0;
            correctKeystrokes = 0;
            errorKeystrokes = 0;
            wordsCompleted = 0;
            combo = 0;
            maxCombo = 0;
            
            document.getElementById('levelSelectArea').style.display = 'none';
            document.getElementById('gameArea').style.display = 'flex';
            document.getElementById('backBtn').setAttribute('onclick', 'backToLevels(); return false;');
            document.getElementById('backBtn').removeAttribute('href');
            
            document.getElementById('levelValue').textContent = levelIdx + 1;
            document.getElementById('scoreValue').textContent = '0';
            
            // 进入游戏时初始化排行榜（显示）
            netEngine.init(true);
            
            showNextWord();
        }

        function showNextWord() {
            if (currentWordIndex >= levels[currentLevel].words.length) {
                completeLevel();
                return;
            }

            const activeWord = levels[currentLevel].words[currentWordIndex];
            typedCount = 0;
            
            document.getElementById('currentIcon').textContent = activeWord.icon;
            document.getElementById('currentMeaning').textContent = activeWord.meaning;
            
            updateWordDisplay();
            
            document.getElementById('wordProgress').textContent = `${currentWordIndex}/${levels[currentLevel].words.length}`;
            document.getElementById('progressBar').style.width = (currentWordIndex / levels[currentLevel].words.length * 100) + '%';
        }

        function updateWordDisplay(isError = false) {
            const activeWord = levels[currentLevel].words[currentWordIndex].word;
            const typedText = activeWord.substring(0, typedCount);
            const remainingBase = activeWord.substring(typedCount);
            
            let html = `<span class="typed">${typedText}</span>`;
            if (isError && remainingBase.length > 0) {
                html += `<span class="error">${remainingBase[0]}</span>${remainingBase.substring(1)}`;
            } else {
                html += remainingBase;
            }
            
            document.getElementById('currentWordDisplay').innerHTML = html;
        }

        window.addEventListener('keydown', (e) => {
            if (gameState !== 'PLAYING') return;
            
            // Allow alpha only
            if (!/^[a-zA-Z]$/.test(e.key) || e.ctrlKey || e.altKey || e.metaKey) return;
            
            const char = e.key.toLowerCase();
            const activeWord = levels[currentLevel].words[currentWordIndex].word.toLowerCase();
            totalKeystrokes++;
            
            if (char === activeWord[typedCount]) {
                // Correct char
                typedCount++;
                correctKeystrokes++;
                combo++;
                if (combo > maxCombo) maxCombo = combo;
                
                playSfx('hit');
                score += 5;
                document.getElementById('scoreValue').textContent = score;
                netEngine.updateScore(score);
                
                updateWordDisplay();
                
                if (typedCount === activeWord.length) {
                    // Word completed
                    score += 20; // Bonus
                    wordsCompleted++;
                    document.getElementById('scoreValue').textContent = score;
                    netEngine.updateScore(score);
                    
                    speakWord(activeWord);
                    
                    // Little pop effect
                    const card = document.getElementById('playCard');
                    card.style.transform = 'scale(1.05)';
                    setTimeout(() => card.style.transform = 'scale(1)', 150);
                    
                    currentWordIndex++;
                    setTimeout(() => {
                        showNextWord();
                    }, 400); // short delay so user sees completion before it snaps
                }
            } else {
                // Wrong char
                combo = 0; 
                errorKeystrokes++;
                playSfx('miss');
                
                // Show red char
                updateWordDisplay(true);
                
                // Screen flash effect
                flashEl.classList.remove('active');
                void flashEl.offsetWidth;
                flashEl.classList.add('active');
                
                // Clear flash after animation
                setTimeout(() => {
                    flashEl.classList.remove('active');
                }, 300);
                
                // Screen shake
                const card = document.getElementById('playCard');
                card.style.transform = 'translateX(15px)';
                setTimeout(() => card.style.transform = 'translateX(-15px)', 50);
                setTimeout(() => card.style.transform = 'translateX(10px)', 100);
                setTimeout(() => card.style.transform = 'translateX(0)', 150);
                
                // Revert error display quickly
                setTimeout(() => {
                    if (gameState === 'PLAYING') updateWordDisplay();
                }, 300);
            }
        });

        function completeLevel() {
            gameState = 'COMPLETED';
            // 使用词库ID和关卡索引组合作为唯一标识
            const levelKey = `${currentCategory.id}_${currentLevel}`;
            if (!completedLevels.includes(levelKey)) {
                completedLevels.push(levelKey);
                localStorage.setItem('completedAdvLevels', JSON.stringify(completedLevels));
            }

            playSfx('complete');
            
            // 计算时长
            const duration = Math.round((Date.now() - levelStartTime) / 1000);
            // 计算准确率
            const accuracy = totalKeystrokes > 0 ? Math.round((correctKeystrokes / totalKeystrokes) * 100) : 0;
            // 计算 WPM (每分钟完成的字符数)
            const wpm = duration > 0 ? Math.round((correctKeystrokes + wordsCompleted * 2) / (duration / 60)) : 0;

            // Save record
            const studentInfo = JSON.parse(localStorage.getItem('studentInfo') || '{}');
            if (studentInfo.id && typeof submitPractice !== 'undefined') {
                submitPractice({
                    student_id: studentInfo.id,
                    mode: 'adventure-english',
                    score: score,
                    duration: duration,
                    wpm: wpm,
                    accuracy: accuracy,
                    total_chars: totalKeystrokes,
                    correct_chars: correctKeystrokes,
                    error_chars: errorKeystrokes,
                    combo: combo,
                    max_combo: maxCombo,
                    level: currentLevel + 1,
                    category: currentCategory.id,
                    category_name: currentCategory.name,
                    extra_data: { 
                        category: currentCategory.id,
                        categoryName: currentCategory.name,
                        level: currentLevel + 1, 
                        theme: levels[currentLevel].theme,
                        wordsCompleted: wordsCompleted,
                        maxCombo: maxCombo,
                        fluency: duration > 0 ? (wordsCompleted / (duration / 60)).toFixed(2) : 0
                    }
                }).catch(err => console.error('Saving failed:', err));
            }

            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOverOverlay').style.display = 'flex';
        }

        function saveCurrentRecord() {
            if (gameState !== 'PLAYING' || score === 0) return;
            
            const studentInfo = JSON.parse(localStorage.getItem('studentInfo') || '{}');
            if (!studentInfo.id || typeof submitPractice === 'undefined') return;
            
            const duration = Math.round((Date.now() - levelStartTime) / 1000);
            const accuracy = totalKeystrokes > 0 ? Math.round((correctKeystrokes / totalKeystrokes) * 100) : 0;
            const wpm = duration > 0 ? Math.round((correctKeystrokes + wordsCompleted * 2) / (duration / 60)) : 0;
            
            submitPractice({
                student_id: studentInfo.id,
                mode: 'adventure-english',
                score: score,
                duration: duration,
                wpm: wpm,
                accuracy: accuracy,
                total_chars: totalKeystrokes,
                correct_chars: correctKeystrokes,
                error_chars: errorKeystrokes,
                combo: combo,
                max_combo: maxCombo,
                level: currentLevel + 1,
                category: currentCategory?.id || 'unknown',
                category_name: currentCategory?.name || '未知',
                extra_data: { 
                    category: currentCategory?.id || 'unknown',
                    categoryName: currentCategory?.name || '未知',
                    level: currentLevel + 1, 
                    theme: levels[currentLevel]?.theme || '',
                    wordsCompleted: wordsCompleted,
                    maxCombo: maxCombo,
                    fluency: duration > 0 ? (wordsCompleted / (duration / 60)).toFixed(2) : 0
                }
            }).catch(err => console.error('保存记录失败:', err));
        }

        function backToLevels() {
            if (gameState === 'PLAYING' && score > 0) {
                saveCurrentRecord();
            }
            gameState = 'MENU';
            document.getElementById('gameOverOverlay').style.display = 'none';
            document.getElementById('levelSelectArea').style.display = 'flex';
            document.getElementById('gameArea').style.display = 'none';
            document.getElementById('backBtn').setAttribute('href', 'practice.html');
            document.getElementById('backBtn').removeAttribute('onclick');
            backToCategories();
        }

        window.addEventListener('beforeunload', function() {
            if (gameState === 'PLAYING' && score > 0) {
                saveCurrentRecord();
            }
        });

        // Init the menu
        initLevels();
    </script>
</body>
</html>
