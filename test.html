<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>苹湖拼音打字系统 - 速度测试</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .test-container {
            max-width: 900px;
        }
        .test-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
        }
        .stat-item {
            text-align: center;
        }
        .stat-value {
            font-size: 36px;
            font-weight: bold;
            color: #DC143C;
        }
        .stat-label {
            color: #888;
            margin-top: 5px;
        }
        .text-display {
            background: white;
            padding: 30px;
            border-radius: 15px;
            font-size: 24px;
            line-height: 1.8;
            margin-bottom: 20px;
            min-height: 200px;
        }
        .text-display span {
            padding: 2px;
        }
        .correct {
            background: #38ef7d;
            color: white;
        }
        .incorrect {
            background: #f5576c;
            color: white;
            animation: shake 0.3s;
        }
        .current {
            border-bottom: 3px solid #DC143C;
            animation: blink 1s infinite;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .input-area {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
        }
        .input-area input {
            width: 100px;
            height: 100px;
            font-size: 60px;
            text-align: center;
            margin-bottom: 0;
            padding: 0;
            border-width: 3px;
        }
        .countdown {
            font-size: 80px;
            font-weight: bold;
            color: #DC143C;
            text-align: center;
            margin: 50px 0;
        }
        .result-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .result-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 500px;
            animation: fadeIn 0.5s;
        }
        .result-icon {
            font-size: 100px;
            margin-bottom: 20px;
        }
        .verify-modal {
            display: flex;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .verify-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
        }
        .verify-input {
            width: 100%;
            padding: 15px;
            font-size: 24px;
            text-align: center;
            letter-spacing: 5px;
            border: 2px solid #ddd;
            border-radius: 10px;
            margin: 20px 0;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="global-header">
        <div class="logo-section">
            <span class="logo-icon">📚</span>
            <span class="logo-text">苹湖拼音打字系统</span>
        </div>
        <div class="user-section" id="headerUserInfo"></div>
    </div>

    <div class="container test-container">
        <div class="test-header">
            <h1>⌨️ 打字速度测试</h1>
            <p style="color: #888;">准备好了吗？测试时间60秒</p>
        </div>

        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-value" id="speed">0</div>
                <div class="stat-label">字/分钟</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="accuracy">100%</div>
                <div class="stat-label">准确率</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="timer">60</div>
                <div class="stat-label">剩余时间(秒)</div>
            </div>
        </div>

        <div id="countdownScreen" class="countdown">
            准备开始...
        </div>

        <div id="testScreen" style="display: none;">
            <div class="text-display" id="textDisplay">
                春天来了，小草从地里钻出来，嫩嫩的，绿绿的。桃花笑红了脸，柳树摇着绿色的长辫子。小燕子从南方飞回来了，在屋檐下搭窝。
            </div>

            <div class="input-area">
                <input type="text" id="inputBox" disabled>
            </div>

            <div style="text-align: center;">
                <button class="btn btn-primary" id="startBtn" onclick="startTest()">开始测试 🚀</button>
                <button class="btn btn-warning" onclick="location.href='home.html'" style="margin-left: 10px;">返回大厅</button>
            </div>
        </div>
    </div>

    <div class="result-modal" id="resultModal">
        <div class="result-content">
            <div class="result-icon">🎉</div>
            <h2>测试完成！</h2>
            <div style="margin: 30px 0;">
                <div style="font-size: 48px; font-weight: bold; color: #DC143C; margin: 20px 0;">
                    <span id="finalSpeed">0</span> 字/分
                </div>
                <div style="font-size: 24px; color: #888;">
                    准确率：<span id="finalAccuracy">0</span>%
                </div>
            </div>
            <div id="passStatus" class="badge badge-success" style="font-size: 18px; padding: 10px 30px;">
                ✅ 达标！继续加油！
            </div>
            <div style="margin-top: 30px;">
                <button class="btn btn-primary" onclick="location.reload()">再测一次</button>
                <button class="btn btn-warning" onclick="location.href='home.html'" style="margin-left: 10px;">返回大厅</button>
            </div>
        </div>
    </div>

    <div class="verify-modal" id="verifyModal">
        <div class="verify-content">
            <h2>🔐 测试验证</h2>
            <p style="color: #888; margin: 15px 0;">请输入老师提供的验证码</p>
            <input type="text" class="verify-input" id="verifyInput" maxlength="6" placeholder="6位验证码">
            <button class="btn btn-primary" onclick="verifyCode()" style="width: 100%; margin-top: 10px;">验证</button>
            <button class="btn btn-secondary" onclick="location.href='home.html'" style="width: 100%; margin-top: 10px;">返回</button>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/test.js"></script>
    <script>
        // 检查验证码
        function checkVerification() {
            const verified = sessionStorage.getItem('testVerified');
            if (verified === 'true') {
                document.getElementById('verifyModal').style.display = 'none';
            } else {
                document.getElementById('verifyModal').style.display = 'flex';
            }
        }

        async function verifyCode() {
            const code = document.getElementById('verifyInput').value.trim().toUpperCase();
            if (!code) {
                alert('请输入验证码');
                return;
            }

            try {
                const response = await fetch('/api/testcode/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code })
                });
                const data = await response.json();

                if (data.valid) {
                    sessionStorage.setItem('testVerified', 'true');
                    document.getElementById('verifyModal').style.display = 'none';
                    alert('验证成功！');
                } else {
                    alert('验证码无效或已过期，请联系老师');
                    document.getElementById('verifyInput').value = '';
                }
            } catch (err) {
                alert('验证失败，请检查网络连接');
            }
        }

        // 认证检查
        const studentInfo = JSON.parse(localStorage.getItem('studentInfo') || '{}');
        if (!studentInfo.id) {
            alert('请先登录');
            location.href = 'login.html';
        }
        document.getElementById('headerUserInfo').innerHTML = `<span class="header-user-info">${studentInfo.name} - ${studentInfo.class}</span>`;

        let typingTest = null;
        let textData = null;

        async function loadText() {
            try {
                textData = await getRandomText('level1');
                renderText();
            } catch (err) {
                alert('加载文本失败，请确保服务器已启动');
            }
        }

        function renderText() {
            const display = document.getElementById('textDisplay');
            display.innerHTML = textData.text.content.split('').map((char, i) =>
                `<span id="char-${i}">${char}</span>`
            ).join('');
        }

        function startTest() {
            if (!textData) {
                alert('文本加载失败，请刷新页面重试');
                return;
            }

            let countdown = 3;
            document.getElementById('countdownScreen').textContent = countdown;
            document.getElementById('countdownScreen').style.display = 'block';
            document.getElementById('testScreen').style.display = 'none';

            const countInterval = setInterval(() => {
                countdown--;
                if (countdown > 0) {
                    document.getElementById('countdownScreen').textContent = countdown;
                } else {
                    clearInterval(countInterval);
                    document.getElementById('countdownScreen').style.display = 'none';
                    document.getElementById('testScreen').style.display = 'block';

                    typingTest = new TypingTest(textData, updateStats, onTestComplete);
                    typingTest.start();

                    const inputBox = document.getElementById('inputBox');
                    inputBox.disabled = false;
                    inputBox.focus();
                }
            }, 1000);
        }

        function updateStats(stats) {
            document.getElementById('speed').textContent = stats.speed;
            document.getElementById('accuracy').textContent = stats.accuracy + '%';
            document.getElementById('timer').textContent = stats.timeLeft;

            // 更新文本显示
            for (let i = 0; i < stats.currentIndex; i++) {
                document.getElementById(`char-${i}`).className = 'correct';
            }
            if (stats.currentIndex < textData.text.content.length) {
                document.getElementById(`char-${stats.currentIndex}`).className = 'current';
            }
        }

        async function onTestComplete(result) {
            document.getElementById('inputBox').disabled = true;
            document.getElementById('finalSpeed').textContent = result.speed;
            document.getElementById('finalAccuracy').textContent = result.accuracy;

            const studentInfo = JSON.parse(localStorage.getItem('studentInfo') || '{}');

            if (result.isValid && result.speed >= 30 && result.accuracy >= 85) {
                document.getElementById('passStatus').className = 'badge badge-success';
                document.getElementById('passStatus').textContent = '✅ 达标！继续加油！';
            } else {
                document.getElementById('passStatus').className = 'badge badge-warning';
                document.getElementById('passStatus').textContent = result.reason || '💪 继续努力！多多练习！';
            }

            // 提交成绩
            if (studentInfo.id) {
                await submitTest({
                    student_id: studentInfo.id,
                    text_id: result.textId,
                    speed: result.speed,
                    accuracy: result.accuracy,
                    correct_count: result.correctCount,
                    error_count: result.errorCount,
                    is_valid: result.isValid
                });
            }

            document.getElementById('resultModal').style.display = 'flex';
        }

        // 监听输入法完成事件
        document.getElementById('inputBox').addEventListener('compositionend', function(e) {
            if (!typingTest) return;

            const input = (e.data || e.target.value.trim())[0];
            if (input) {
                const isCorrect = typingTest.validateInput(input);

                if (isCorrect) {
                    e.target.style.borderColor = '#38ef7d';
                } else {
                    e.target.style.borderColor = '#f5576c';
                }

                // 延迟清空，让用户看到输入的内容
                setTimeout(() => {
                    e.target.value = '';
                    e.target.style.borderColor = '#e0e0e0';
                }, 200);
            }
        });

        // 禁用退格键
        document.getElementById('inputBox').addEventListener('keydown', function(e) {
            if (e.key === 'Backspace') {
                e.preventDefault();
            }
        });

        document.getElementById('testScreen').style.display = 'block';
        document.getElementById('countdownScreen').style.display = 'none';
        checkVerification();
        loadText();
    </script>
</body>
</html>
