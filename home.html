<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>苹湖拼音打字系统</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .home-container {
            max-width: 1000px;
        }
        .user-info {
            background: linear-gradient(135deg, #DC143C 0%, #8B0000 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logout-btn {
            background: rgba(255,255,255,0.2);
            border: 2px solid white;
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .logout-btn:hover {
            background: white;
            color: #DC143C;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .menu-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 3px solid transparent;
        }
        .menu-card:hover {
            transform: translateY(-10px);
            border-color: #DC143C;
            box-shadow: 0 15px 35px rgba(220, 20, 60, 0.3);
        }
        .menu-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }
        .menu-title {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }
        .menu-desc {
            color: #888;
            font-size: 14px;
        }
        .rank-section {
            background: white;
            border-radius: 15px;
            padding: 25px;
        }
        .rank-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .rank-tab {
            padding: 10px 25px;
            border: none;
            border-radius: 20px;
            background: #f0f0f0;
            color: #666;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        .rank-tab.active {
            background: linear-gradient(135deg, #DC143C 0%, #8B0000 100%);
            color: white;
        }
        .rank-tab:hover:not(.active) {
            background: #e0e0e0;
        }
        .rank-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .online-count {
            background: #38ef7d;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
        }

        /* 修改密码弹窗样式 */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            border-radius: 15px;
            width: 400px;
            max-width: 90%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid #eee;
        }

        .modal-header h3 {
            margin: 0;
            color: #333;
        }

        .modal-close {
            font-size: 28px;
            color: #999;
            cursor: pointer;
            line-height: 1;
        }

        .modal-close:hover {
            color: #333;
        }

        .modal-body {
            padding: 25px;
        }

        .modal-body .form-group {
            margin-bottom: 20px;
        }

        .modal-body .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #666;
            font-size: 14px;
        }

        .modal-body .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            transition: all 0.3s;
        }

        .modal-body .form-group input:focus {
            outline: none;
            border-color: #DC143C;
            box-shadow: 0 0 0 3px rgba(220, 20, 60, 0.1);
        }

        .modal-footer {
            padding: 15px 25px 25px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .btn-cancel {
            padding: 10px 25px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: white;
            color: #666;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .btn-cancel:hover {
            background: #f5f5f5;
        }

        .btn-primary {
            padding: 10px 25px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #DC143C 0%, #8B0000 100%);
            color: white;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(220, 20, 60, 0.3);
        }

        .error-msg {
            color: #DC143C;
            font-size: 13px;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="global-header">
        <div class="logo-section">
            <span class="logo-icon">📚</span>
            <span class="logo-text">苹湖拼音打字系统</span>
            <a href="about.html" style="margin-left: 20px; color: white; text-decoration: none; font-size: 14px;">关于我们</a>
        </div>
        <div class="user-section" id="headerUserInfo"></div>
    </div>

    <div class="container home-container">
        <div class="user-info">
            <div>
                <h2 style="color: white; margin: 0;">👋 你好，<span id="userName">小明</span></h2>
                <p style="margin: 5px 0 0 0; opacity: 0.9;">
                    班级：<span id="userClass">三年级1班</span>
                    <button id="changeClassBtn" class="logout-btn" style="padding: 3px 10px; font-size: 12px; margin-left: 10px;" onclick="showProfile()">我的资料</button>
                    <span id="classChangeTip" style="font-size: 12px; margin-left: 8px; color: #ffd700; display: none;"></span>
                </p>
            </div>
            <div style="display: flex; align-items: center; gap: 15px;">
                <div style="text-align: right;">
                    <div style="font-size: 14px; opacity: 0.9;">今日练习</div>
                    <div style="font-size: 28px; font-weight: bold;">23 分钟</div>
                </div>
                <button class="logout-btn" onclick="logout()">退出登录</button>
            </div>
        </div>

        <!-- 修改班级弹窗 -->
        <div id="classModal" class="modal" style="display: none;">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>修改班级</h3>
                    <span class="modal-close" onclick="closeClassModal()">&times;</span>
                </div>
                <div class="modal-body">
                    <p style="margin-bottom: 15px; color: #666;">请选择您正确的班级，选择后30分钟内只能修改一次。</p>
                    <div class="form-group">
                        <label>学校</label>
                        <select id="classSchool" onchange="updateClassGrades()">
                            <option value="">请选择学校</option>
                            <option value="谷山学校">谷山学校</option>
                            <option value="中华路小学">中华路小学</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>年级</label>
                        <select id="classGrade" onchange="updateClassNumbers()">
                            <option value="">请选择年级</option>
                            <option value="1">一年级</option>
                            <option value="2">二年级</option>
                            <option value="3">三年级</option>
                            <option value="4">四年级</option>
                            <option value="5">五年级</option>
                            <option value="6">六年级</option>
                            <option value="7">七年级</option>
                            <option value="8">八年级</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>班级</label>
                        <select id="classNumber">
                            <option value="">请先选择学校和年级</option>
                        </select>
                    </div>
                    <div id="classError" class="error-msg" style="display: none;"></div>
                </div>
                <div class="modal-footer">
                    <button class="btn-cancel" onclick="closeClassModal()">取消</button>
                    <button class="btn-primary" onclick="submitClassChange()">保存</button>
                </div>
            </div>
        </div>

        <!-- 个人资料弹窗 -->
        <div id="profileModal" class="modal" style="display: none;">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>个人资料</h3>
                    <span class="modal-close" onclick="closeProfileModal()">&times;</span>
                </div>
                <div class="modal-body">
                    <p style="margin-bottom: 15px; color: #666;">完善您的个人资料，生日用于登录时的身份验证。修改班级后30分钟内只能修改一次。</p>
                    <div class="form-group">
                        <label>姓名</label>
                        <input type="text" id="profileName" readonly style="background: #f5f5f5; color: #666;">
                    </div>
                    <div class="form-group">
                        <label>学校</label>
                        <input type="text" id="profileSchoolDisplay" readonly style="background: #f5f5f5; color: #666;">
                    </div>
                    <div class="form-group">
                        <label>年级</label>
                        <input type="text" id="profileGradeDisplay" readonly style="background: #f5f5f5; color: #666;">
                    </div>
                    <div class="form-group">
                        <label>班级 <span style="font-weight: normal; color: #999;">（可选修改）</span></label>
                        <select id="profileClassNumber">
                            <option value="">请选择班级</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>生日 <span style="font-weight: normal; color: #999;">（用于登录身份验证）</span></label>
                        <input type="date" id="profileBirthday" placeholder="请选择生日">
                    </div>
                    
                    <hr style="margin: 20px 0; border: none; border-top: 1px solid #e5e7eb;">
                    
                    <h4 style="margin: 0 0 15px 0; color: #374151;">修改密码</h4>
                    <div class="form-group">
                        <label>当前密码</label>
                        <input type="password" id="currentPassword" placeholder="请输入当前密码">
                    </div>
                    <div class="form-group">
                        <label>新密码</label>
                        <input type="password" id="newPassword" placeholder="请输入新密码（至少6位）">
                    </div>
                    <div class="form-group">
                        <label>确认新密码</label>
                        <input type="password" id="confirmNewPassword" placeholder="请再次输入新密码">
                    </div>
                    
                    <div id="profileError" class="error-msg" style="display: none;"></div>
                </div>
                <div class="modal-footer">
                    <button class="btn-cancel" onclick="closeProfileModal()">取消</button>
                    <button class="btn-primary" onclick="saveProfile()">保存</button>
                </div>
            </div>
        </div>

        <div class="grid">
            <div class="menu-card" onclick="location.href='test.html'">
                <div class="menu-icon">🎯</div>
                <div class="menu-title">正式测试</div>
                <div class="menu-desc">60秒打字速度测试</div>
            </div>

            <div class="menu-card" onclick="location.href='practice.html'">
                <div class="menu-icon">🎮</div>
                <div class="menu-title">练习模式</div>
                <div class="menu-desc">趣味游戏，轻松练习</div>
            </div>

            <div class="menu-card" onclick="location.href='profile.html'">
                <div class="menu-icon">📊</div>
                <div class="menu-title">我的成绩</div>
                <div class="menu-desc">查看个人数据统计</div>
            </div>

            <div class="menu-card" onclick="location.href='grade.html'">
                <div class="menu-icon">🏫</div>
                <div class="menu-title">我的年级</div>
                <div class="menu-desc">年级排行榜与数据对比</div>
            </div>
        </div>

        <div class="rank-section">
            <div class="rank-tabs">
                <button class="rank-tab active" onclick="switchRankTab('practice')">练习模式</button>
                <button class="rank-tab" onclick="switchRankTab('test')">正式测试</button>
            </div>
            <div id="rankingContainer"></div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        // 认证检查
        const studentInfo = JSON.parse(localStorage.getItem('studentInfo') || '{}');
        if (!studentInfo.id) {
            alert('请先登录');
            location.href = 'login.html';
        }

        // 填充header用户信息
        document.getElementById('headerUserInfo').innerHTML = `
            <span class="header-user-info">${studentInfo.name} - ${studentInfo.class}</span>
        `;

        if (studentInfo.name) {
            document.getElementById('userName').textContent = studentInfo.name;
            document.getElementById('userClass').textContent = studentInfo.class;
        }

        // 排行榜模式
        let currentRankMode = 'practice';

        // 切换排行榜tab
        function switchRankTab(mode) {
            currentRankMode = mode;
            document.querySelectorAll('.rank-tab').forEach(tab => tab.classList.remove('active'));
            document.querySelector(`.rank-tab[onclick="switchRankTab('${mode}')"]`).classList.add('active');
            loadRanking();
        }

        // 加载排行榜
        async function loadRanking() {
            if (currentRankMode === 'practice') {
                await loadPracticeRanking();
            } else {
                await loadTestRanking();
            }
        }

        // 加载练习模式排行榜
        async function loadPracticeRanking() {
            try {
                const { ranking } = await getInterstellarHighestScoreRanking(10);
                const container = document.getElementById('rankingContainer');
                const medals = ['🥇', '🥈', '🥉'];
                const classes = ['rank-gold', 'rank-silver', 'rank-bronze'];

                if (!ranking || ranking.length === 0) {
                    container.innerHTML = '<div style="text-align: center; padding: 30px; color: #999;">暂无练习记录</div>';
                    return;
                }

                let html = '';
                ranking.slice(0, 10).forEach((item, i) => {
                    const medal = i < 3 ? medals[i] : (i + 1);
                    const cls = i < 3 ? classes[i] : '';
                    html += `<div class="rank-item">
                        <div class="rank-number ${cls}">${medal}</div>
                        <div style="flex: 1;">
                            <div style="font-weight: bold; font-size: 18px;">${item.name}</div>
                            <div style="color: #888; font-size: 14px;">${item.school || ''} ${item.class || ''}</div>
                        </div>
                        <div style="text-align: right;">
                            <div style="font-size: 24px; font-weight: bold; color: #DC143C;">${item.score} 分</div>
                        </div>
                    </div>`;
                });

                container.innerHTML = html;
            } catch (err) {
                console.error('加载练习排行榜失败', err);
            }
        }

        // 加载正式测试排行榜
        async function loadTestRanking() {
            try {
                const { ranking } = await getTestRanking();
                const container = document.getElementById('rankingContainer');
                const medals = ['🥇', '🥈', '🥉'];
                const classes = ['rank-gold', 'rank-silver', 'rank-bronze'];

                if (!ranking || ranking.length === 0) {
                    container.innerHTML = '<div style="text-align: center; padding: 30px; color: #999;">暂无测试记录</div>';
                    return;
                }

                let html = '';
                ranking.slice(0, 10).forEach((item, i) => {
                    const medal = i < 3 ? medals[i] : (i + 1);
                    const cls = i < 3 ? classes[i] : '';
                    html += `<div class="rank-item">
                        <div class="rank-number ${cls}">${medal}</div>
                        <div style="flex: 1;">
                            <div style="font-weight: bold; font-size: 18px;">${item.name}</div>
                            <div style="color: #888; font-size: 14px;">${item.class}</div>
                        </div>
                        <div style="text-align: right;">
                            <div style="font-size: 24px; font-weight: bold; color: #DC143C;">${item.speed} 字/分</div>
                            <div style="color: #888; font-size: 14px;">准确率 ${item.accuracy}%</div>
                        </div>
                    </div>`;
                });

                container.innerHTML = html;
            } catch (err) {
                console.error('加载测试排行榜失败', err);
            }
        }

        // 加载在线人数
        async function loadOnline() {
            try {
                const { count } = await getOnlineCount();
                document.getElementById('onlineCount').textContent = `👤 在线：${count}人`;
            } catch (err) {}
        }

        loadRanking();
        setInterval(loadRanking, 5000);

        function logout() {
            if (confirm('确定要退出登录吗？')) {
                localStorage.removeItem('studentInfo');
                location.href = 'login.html';
            }
        }


        // ==================== 修改班级功能 ====================
        const CLASS_CHANGE_COOLDOWN_MINUTES = 30;

        // 检查班级修改冷却状态
        async function checkClassChangeStatus() {
            try {
                const response = await fetch(`/api/student/class-change-status?student_id=${studentInfo.id}`);
                const data = await response.json();
                
                const btn = document.getElementById('changeClassBtn');
                const tip = document.getElementById('classChangeTip');
                
                if (data.canChange) {
                    btn.disabled = false;
                    btn.textContent = '修改班级';
                    tip.style.display = 'none';
                } else {
                    btn.disabled = true;
                    tip.style.display = 'inline';
                    startClassChangeCountdown(data.remainingSeconds);
                }
            } catch (err) {
                console.error('检查班级修改状态失败:', err);
            }
        }

        // 班级修改冷却倒计时
        function startClassChangeCountdown(seconds) {
            const tip = document.getElementById('classChangeTip');
            const btn = document.getElementById('changeClassBtn');
            
            const updateCountdown = () => {
                if (seconds <= 0) {
                    btn.disabled = false;
                    btn.textContent = '修改班级';
                    tip.style.display = 'none';
                    return;
                }
                
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                tip.textContent = `(${mins}:${secs.toString().padStart(2, '0')})后可修改`;
                seconds--;
                setTimeout(updateCountdown, 1000);
            };
            
            updateCountdown();
        }

        // 显示修改班级弹窗
        function showChangeClass() {
            document.getElementById('classModal').style.display = 'flex';
            document.getElementById('classSchool').value = '';
            document.getElementById('classGrade').value = '';
            document.getElementById('classNumber').innerHTML = '<option value="">请先选择学校和年级</option>';
            document.getElementById('classError').style.display = 'none';
            
            // 预填当前班级信息
            const currentClass = studentInfo.class || '';
            const match = currentClass.match(/^(.+?)(\d+)年级(\d+)班$/);
            if (match) {
                const school = match[1];
                const grade = parseInt(match[2]);
                const classNum = parseInt(match[3]);
                
                // 尝试设置学校
                const schoolSelect = document.getElementById('classSchool');
                for (let i = 0; i < schoolSelect.options.length; i++) {
                    if (schoolSelect.options[i].text.includes(school) || school === schoolSelect.options[i].value) {
                        schoolSelect.value = schoolSelect.options[i].value;
                        break;
                    }
                }
                
                // 设置年级
                if (grade >= 1 && grade <= 8) {
                    document.getElementById('classGrade').value = grade;
                    updateClassNumbers();
                    
                    // 延迟设置班级号，等选项加载完成
                    setTimeout(() => {
                        document.getElementById('classNumber').value = classNum;
                    }, 100);
                }
            }
        }

        // 关闭修改班级弹窗
        function closeClassModal() {
            document.getElementById('classModal').style.display = 'none';
        }

        // 点击弹窗背景关闭
        document.getElementById('classModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeClassModal();
            }
        });

        // 更新班级号下拉框（根据学校）
        function updateClassGrades() {
            const school = document.getElementById('classSchool').value;
            const gradeSelect = document.getElementById('classGrade');
            const classSelect = document.getElementById('classNumber');
            
            gradeSelect.value = '';
            classSelect.innerHTML = '<option value="">请先选择学校和年级</option>';
        }

        // 更新班级号下拉框
        function updateClassNumbers() {
            const grade = document.getElementById('classGrade').value;
            const classSelect = document.getElementById('classNumber');
            
            if (!grade) {
                classSelect.innerHTML = '<option value="">请先选择学校和年级</option>';
                return;
            }
            
            // 获取该年级已有的班级号
            fetch('/api/admin/students')
                .then(res => res.json())
                .then(data => {
                    const students = data.students || [];
                    const school = document.getElementById('classSchool').value;
                    
                    // 找出该学校该年级的所有班级
                    const classNumbers = new Set();
                    students.forEach(s => {
                        if (s.school === school && s.grade === parseInt(grade)) {
                            classNumbers.add(s.class_number);
                        }
                    });
                    
                    // 如果没有班级，显示1-10
                    if (classNumbers.size === 0) {
                        for (let i = 1; i <= 10; i++) {
                            classNumbers.add(i);
                        }
                    }
                    
                    const sorted = Array.from(classNumbers).sort((a, b) => a - b);
                    let options = '<option value="">请选择班级</option>';
                    sorted.forEach(num => {
                        options += `<option value="${num}">${num}班</option>`;
                    });
                    classSelect.innerHTML = options;
                })
                .catch(err => {
                    // 默认显示1-10
                    let options = '<option value="">请选择班级</option>';
                    for (let i = 1; i <= 10; i++) {
                        options += `<option value="${i}">${i}班</option>`;
                    }
                    classSelect.innerHTML = options;
                });
        }

        // 提交修改班级
        async function submitClassChange() {
            const school = document.getElementById('classSchool').value;
            const grade = parseInt(document.getElementById('classGrade').value);
            const classNumber = parseInt(document.getElementById('classNumber').value);
            const errorDiv = document.getElementById('classError');

            // 验证输入
            if (!school) {
                errorDiv.textContent = '请选择学校';
                errorDiv.style.display = 'block';
                return;
            }
            if (!grade) {
                errorDiv.textContent = '请选择年级';
                errorDiv.style.display = 'block';
                return;
            }
            if (!classNumber) {
                errorDiv.textContent = '请选择班级';
                errorDiv.style.display = 'block';
                return;
            }

            try {
                const response = await fetch('/api/student/change-class', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        student_id: studentInfo.id,
                        school: school,
                        grade: grade,
                        class_number: classNumber
                    })
                });
                const result = await response.json();

                if (result.success) {
                    alert('班级修改成功！');
                    closeClassModal();
                    
                    // 更新本地存储的学生信息
                    const gradeLabels = ['', '一年级', '二年级', '三年级', '四年级', '五年级', '六年级', '七年级', '八年级'];
                    studentInfo.school = school;
                    studentInfo.grade = grade;
                    studentInfo.class_number = classNumber;
                    studentInfo.class = `${gradeLabels[grade]}${classNumber}班`;
                    localStorage.setItem('studentInfo', JSON.stringify(studentInfo));
                    
                    // 更新页面显示
                    document.getElementById('userClass').textContent = studentInfo.class;
                    
                    // 启动冷却倒计时
                    startClassChangeCountdown(CLASS_CHANGE_COOLDOWN_MINUTES * 60);
                    document.getElementById('changeClassBtn').disabled = true;
                } else {
                    errorDiv.textContent = result.error || '修改失败';
                    errorDiv.style.display = 'block';
                }
            } catch (err) {
                errorDiv.textContent = '网络错误，请稍后重试';
                errorDiv.style.display = 'block';
            }
        }

        // 显示个人资料弹窗
        function showProfile() {
            document.getElementById('profileModal').style.display = 'flex';
            document.getElementById('profileError').style.display = 'none';
            
            // 清空密码字段
            document.getElementById('currentPassword').value = '';
            document.getElementById('newPassword').value = '';
            document.getElementById('confirmNewPassword').value = '';
            
            const gradeLabels = ['', '一年级', '二年级', '三年级', '四年级', '五年级', '六年级', '七年级', '八年级'];
            
            // 预填当前学生信息
            document.getElementById('profileName').value = studentInfo.name || '';
            document.getElementById('profileSchoolDisplay').value = studentInfo.school || '';
            document.getElementById('profileGradeDisplay').value = gradeLabels[studentInfo.grade] || '';
            document.getElementById('profileBirthday').value = studentInfo.birthday || '';
            
            // 加载班级选项
            loadProfileClasses();
        }

        // 加载班级选项
        function loadProfileClasses() {
            const school = studentInfo.school;
            const grade = studentInfo.grade;
            const classSelect = document.getElementById('profileClassNumber');
            
            if (!school || !grade) {
                classSelect.innerHTML = '<option value="">暂无班级信息</option>';
                return;
            }
            
            // 获取该年级已有的班级号
            fetch('/api/admin/students')
                .then(res => res.json())
                .then(data => {
                    const students = data.students || [];
                    
                    const classNumbers = new Set();
                    students.forEach(s => {
                        if (s.school === school && s.grade === grade) {
                            classNumbers.add(s.class_number);
                        }
                    });
                    
                    // 始终包含当前班级
                    if (studentInfo.class_number) {
                        classNumbers.add(studentInfo.class_number);
                    }
                    
                    if (classNumbers.size === 0) {
                        for (let i = 1; i <= 10; i++) {
                            classNumbers.add(i);
                        }
                    }
                    
                    const sorted = Array.from(classNumbers).sort((a, b) => a - b);
                    let options = '<option value="">请选择班级</option>';
                    sorted.forEach(num => {
                        const selected = num === studentInfo.class_number ? 'selected' : '';
                        options += `<option value="${num}" ${selected}>${num}班</option>`;
                    });
                    classSelect.innerHTML = options;
                })
                .catch(err => {
                    let options = '<option value="">请选择班级</option>';
                    for (let i = 1; i <= 10; i++) {
                        const selected = i === studentInfo.class_number ? 'selected' : '';
                        options += `<option value="${i}" ${selected}>${i}班</option>`;
                    }
                    classSelect.innerHTML = options;
                });
        }

        // 关闭个人资料弹窗
        function closeProfileModal() {
            document.getElementById('profileModal').style.display = 'none';
        }

        // 点击弹窗背景关闭
        document.getElementById('profileModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeProfileModal();
            }
        });

        // 保存个人资料（生日、班级和密码）
        async function saveProfile() {
            const birthday = document.getElementById('profileBirthday').value;
            const classNumber = parseInt(document.getElementById('profileClassNumber').value);
            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmNewPassword').value;
            const errorDiv = document.getElementById('profileError');

            // 检查是否修改密码
            if (currentPassword || newPassword || confirmPassword) {
                if (!currentPassword) {
                    errorDiv.textContent = '请输入当前密码';
                    errorDiv.style.display = 'block';
                    return;
                }
                if (!newPassword) {
                    errorDiv.textContent = '请输入新密码';
                    errorDiv.style.display = 'block';
                    return;
                }
                if (newPassword.length < 6) {
                    errorDiv.textContent = '新密码至少6位';
                    errorDiv.style.display = 'block';
                    return;
                }
                if (newPassword !== confirmPassword) {
                    errorDiv.textContent = '两次密码不一致';
                    errorDiv.style.display = 'block';
                    return;
                }

                // 修改密码
                try {
                    const pwdRes = await fetch('/api/student/change-password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            student_id: studentInfo.id,
                            current_password: currentPassword,
                            new_password: newPassword
                        })
                    });
                    const pwdResult = await pwdRes.json();
                    
                    if (!pwdResult.success) {
                        errorDiv.textContent = pwdResult.error || '密码修改失败';
                        errorDiv.style.display = 'block';
                        return;
                    }
                } catch (err) {
                    errorDiv.textContent = '网络错误，请稍后重试';
                    errorDiv.style.display = 'block';
                    return;
                }
            }

            // 如果没有填写生日也没有选择班级，直接返回
            if (!birthday && !classNumber && !currentPassword && !newPassword) {
                closeProfileModal();
                return;
            }

            try {
                const response = await fetch('/api/student/profile', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        student_id: studentInfo.id,
                        birthday: birthday || null,
                        class_number: classNumber || null
                    })
                });
                const result = await response.json();

                if (result.success) {
                    let successMsg = '保存成功！';
                    if (currentPassword && newPassword) {
                        successMsg = '密码和个人资料保存成功！';
                    }
                    alert(successMsg);
                    closeProfileModal();
                    
                    // 更新本地存储的学生信息
                    if (birthday) studentInfo.birthday = birthday;
                    if (classNumber) {
                        studentInfo.class_number = classNumber;
                        const gradeLabels = ['', '一年级', '二年级', '三年级', '四年级', '五年级', '六年级', '七年级', '八年级'];
                        studentInfo.class = `${gradeLabels[studentInfo.grade]}${classNumber}班`;
                        document.getElementById('userClass').textContent = studentInfo.class;
                        
                        // 如果修改了班级，启动冷却倒计时
                        startClassChangeCountdown(CLASS_CHANGE_COOLDOWN_MINUTES * 60);
                    }
                    localStorage.setItem('studentInfo', JSON.stringify(studentInfo));
                } else {
                    errorDiv.textContent = result.error || '保存失败';
                    errorDiv.style.display = 'block';
                }
            } catch (err) {
                errorDiv.textContent = '网络错误，请稍后重试';
                errorDiv.style.display = 'block';
            }
        }

        // 清空密码输入框
        function clearPasswordFields() {
            document.getElementById('currentPassword').value = '';
            document.getElementById('newPassword').value = '';
            document.getElementById('confirmNewPassword').value = '';
        }

        // 页面加载完成后检查班级修改状态
        window.addEventListener('load', function() {
            if (studentInfo && studentInfo.id) {
                checkClassChangeStatus();
            }
        });
    </script>
</body>
</html>
